        <form id="feedbackForm" action="https://formspree.io/f/mpqqbgal" method="POST">
            <label>Write your full name:</label><br>
            <input type="text" name="student_name" placeholder="First name Last name" required style="width: 100%; margin-bottom: 10px;"><br>
        
            <label for="phone">(It's optional) <br> Write your phone number (in case we need):</label>
            <input type="tel" id="phone" name="phone_number" placeholder="+998 90 123 45 67">

            <label for="rating">Rate the lesson (1-5):</label>
            <select id="rating" name="lesson_rating">
                <option value="5">⭐⭐⭐⭐⭐ - Very good</option>
                <option value="4">⭐⭐⭐⭐ - Good and satisfying</option>
                <option value="3">⭐⭐⭐ - Normal</option>
                <option value="2">⭐⭐ - Dissatisfying</option>
                <option value="1">⭐ - Bad</option>
            </select>

            <div class="feedback-sections">
                <div class="field-group">
                    <label for="positives">✅ Positive sides of the lesson:</label>
                    <textarea id="positives" name="positive_sides" rows="4" placeholder="What was more appealing to you?" required></textarea>
                </div>
            
                <div class="field-group">
                    <label for="negatives">⚠️ Negative sides of the lesson:</label>
                    <textarea id="negatives" name="negative_sides" rows="4" placeholder="What was not that appealing to you?" required></textarea>
                </div>
            </div>

            <label>Write your Opinion/Suggestions/Feedback regarding the lesson:</label><br>
            <textarea name="feedback" placeholder="........." required style="width: 100%; height: 120px;"></textarea><br>
        
            <button type="submit" style="padding: 10px 20px; background: #0acd75; color: white; border: none; cursor: pointer; border-radius: 5px;">
                Submit
            </button>
        </form>

        <footer style="text-align: center; margin-top: 20px; font-size: 14px; color: #888;">
            <p>&copy; 2026 Pay a visit to a hospitable host <a href="https://t.me/Master_Ibrokhim">@Master_Ibrokhim</a></p>
